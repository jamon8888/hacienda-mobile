buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 26
        // io.xberg:xberg-android's AAR metadata requires compileSdk 36+ of any consumer. AGP
        // 8.7.3 only supports through API 35 -- AGP 8.10.0 is the first line that supports
        // compileSdk 36 (paired with a Gradle wrapper bump to 8.11.1, see
        // gradle/wrapper/gradle-wrapper.properties). This does not disturb the Kotlin/KSP
        // version alignment documented below: that ceiling comes from React Native 0.76.3's own
        // Gradle plugin being compiled against the KGP 1.9 API, which is independent of the AGP
        // version.
        compileSdkVersion = 36
        // targetSdkVersion stays at 35 deliberately -- only compileSdk (compile-time API
        // surface) needs to satisfy xberg-android's AAR metadata check. targetSdk opts the app
        // into new runtime behavior changes for API 36, which is a separate, larger decision
        // out of scope for unblocking this build.
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.2.20"
        objectboxVersion = "4.3.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.10.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Pinned explicitly, overriding the 1.9.24 that React Native 0.76.3's own version catalog
        // would otherwise supply (node_modules/@react-native/gradle-plugin/gradle/libs.versions.toml).
        //
        // Why: io.xberg:xberg-android constrains kotlin-stdlib to 2.2.10 (every published version
        // 1.0.0..1.0.12 does), so Gradle resolves the stdlib to 2.2.20 project-wide. A 1.9.24
        // compiler against a 2.2.x stdlib fails every Kotlin module with "Unresolved reference:
        // mapOf" and metadata-version errors, so the compiler has to track the stdlib.
        //
        // Why 2.2.20 specifically -- this value must match what the buildscript classpath
        // ACTUALLY resolves to, which is decided by React Native's Gradle plugin, not here.
        // settings.gradle includeBuild()s node_modules/@react-native/gradle-plugin, so it joins
        // this classpath as a composite project, and patches/@react-native+gradle-plugin+0.76.3
        // .patch sets that plugin's own version catalog to kotlin = "2.2.20" (it also migrates
        // the plugin's build scripts off the kotlinOptions DSL and off apiVersion 1.6, both of
        // which KGP 2.2 rejects -- that is what makes 2.2.20 viable at all).
        //
        // Gradle then resolves the classpath to the highest requested version, so declaring
        // anything lower here does NOT take effect -- it is silently upgraded. Run
        // `./gradlew buildEnvironment` to see it: "kotlin-gradle-plugin:2.0.21 -> 2.2.20".
        //
        // Keeping this in sync matters because the KSP coordinate below is derived from it, and
        // KSP hard-fails on a mismatch rather than degrading: with kotlinVersion = "2.0.21" the
        // build died at configuration time with
        //   ksp-2.0.21-1.0.28 is too old for kotlin-2.2.20
        //   > Could not create task ':app:kspDebugKotlin'
        //   > Cannot query the value of task ':app:kspDebugKotlin' property
        //     'classpathSnapshotProperties.useClasspathSnapshot'
        // because KSP's task factory read a KGP property that had moved.
        //
        // So: if the patch's kotlin version changes, change this to match.
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        classpath("io.objectbox:objectbox-gradle-plugin:$objectboxVersion")
        // KSP replaces kapt for annotation processing -- see the comment in app/build.gradle.
        // The version's prefix must match the RESOLVED kotlin-gradle-plugin exactly (see above);
        // KSP releases are per-Kotlin, and the suffix advances independently (2.0.x for the
        // Kotlin 2.2 line, 1.0.x for 2.0 and earlier).
        classpath("com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:$kotlinVersion-2.0.4")
        // Add the Google Services plugin dependency
        // This is used exclusively for Firebase functionality
        classpath 'com.google.gms:google-services:4.4.3'
    }
}

apply plugin: "com.facebook.react.rootproject"

// The compiler is capped at 2.0.21 by React Native (see above), but io.xberg:xberg-android ships
// classes carrying Kotlin 2.2.0 metadata and drags kotlin-stdlib up to 2.2.20. Without this, the
// 2.0.21 compiler rejects both with "Module was compiled with an incompatible version of Kotlin".
//
// The stdlib is deliberately left at the resolved 2.2.20 rather than forced back to 2.0.21:
// xberg-android's bytecode was compiled against the 2.2 stdlib, so downgrading risks
// NoSuchMethodError at runtime, while keeping it stays backward-compatible for every other
// module. This flag only relaxes a compile-time version assertion; it changes nothing shipped.
//
// Uses the legacy kotlinOptions DSL on purpose. The modern compilerOptions equivalent fails on
// kapt stub tasks under KGP 2.0.x -- KaptGenerateStubsTask ships no default for freeCompilerArgs,
// so add() leaves the property with no value and the task dies with "Cannot query the value of
// property 'freeCompilerArgs'". kotlinOptions' eager shim reads through an empty default instead.
// Deprecated in 2.0, removed in 2.2 -- revisit together with the Kotlin cap above.
allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            freeCompilerArgs += ["-Xskip-metadata-version-check"]
        }
    }
}

