dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    //implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // for edge-to-edge display
    implementation "androidx.activity:activity-ktx:1.9.3" 
    
    // for download manager
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    def room_version = "2.7.1"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    
    // Add Guava dependency for ListenableFuture
    implementation 'com.google.guava:guava:32.1.3-android'
    // Xberg document extraction
    implementation 'io.xberg:xberg-android:1.0.8'
    // Xberg's API is typed (ExtractionConfig has 47 fields, results are ExtractedDocument
    // objects) but a React Native bridge can only carry strings, so XbergModule uses Jackson to
    // round-trip the SDK's own Jackson-annotated DTOs. Xberg declares these as `implementation`,
    // which reaches consumers at runtime scope only -- they have to be requested explicitly to be
    // on the compile classpath. Versions deliberately match Xberg's own to avoid two Jacksons.
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin:2.22.1'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.1'
    // ONNX Runtime for Silero VAD
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'
    // LiteRT for EmbeddingGemma inference. litert-gpu was dropped -- Google's Maven repo never
    // published a 2.x release of it (maxes out at 1.4.2, while litert itself reached 2.2.0), so
    // it 404'd on every resolve. Not currently used by EmbeddingGemmaModule.kt (still a
    // CPU-only placeholder), so nothing regresses; re-add once litert-gpu ships a matching
    // 2.x version or EmbeddingGemmaModule actually wires up a GPU delegate.
    implementation 'com.google.ai.edge.litert:litert:2.1.6'
    // Core library desugaring for Java 8+ APIs (MethodHandle, etc.)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}

