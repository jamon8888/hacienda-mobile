import java.nio.file.Paths

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// KSP rather than kapt, and it must be applied before io.objectbox so that plugin wires its
// processor through KSP instead of falling back to kapt.
//
// kapt cannot be used in this project at all: kapt 2.0.x embeds a Kotlin-metadata reader capped
// at metadata version 2.0.0, and io.xberg:xberg-android -- along with the kotlin-stdlib 2.2.20
// and kotlinx-coroutines 1.11.0 it drags in -- ships classes carrying 2.2.0 metadata. Annotation
// processing therefore died with "Provided Metadata instance has version 2.2.0, while maximum
// supported version is 2.0.0". Unlike the compiler, kapt has no skip-check escape hatch, so the
// only fix that does not mean forking Xberg is to stop using kapt.
apply plugin: "com.google.devtools.ksp"
apply plugin: "io.objectbox"

apply plugin: 'com.google.gms.google-services'

apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

/**
 * Enable this to build with QNN SDK (Genie Runtime LLM)
 * def qnnSDKLocalPath = System.getenv('QNN_SDK_ROOT')
 * def buildDir = project.getLayout().getBuildDirectory()
 * def libsDir = buildDir.dir("libs")
 * if(qnnSDKLocalPath == null) throw new RuntimeException("QNN_SDK_ROOT is not set and must be set in the environment variables")
 * else println("Building with QNN SDK from $qnnSDKLocalPath")
